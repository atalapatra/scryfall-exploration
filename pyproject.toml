[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atalapatra_scryfall"
dynamic = ["version"]
description = "A small, polite Python client framework for the Scryfall API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scryfall-card-info = "atalapatra_scryfall.cli:main"

[project.urls]
Repository = "https://github.com/atalapatra/scryfall-exploration"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atalapatra_scryfall = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "atalapatra_scryfall.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
